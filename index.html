<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 검색 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
    }

    .page {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
      min-height: 500px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px 20px;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .search-button,
    .location-button {
      padding: 11px 14px;
      border: 0;
      border-radius: 8px;
      background: #fee500;
      color: #222;
      font-weight: bold;
    }

    .location-button {
      margin-top: 10px;
      background: #f2f3f5;
    }

    .status {
      min-height: 22px;
      margin: 12px 0 8px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .results {
      flex: 1;
      overflow-y: auto;
      margin: 0 -4px;
      padding: 0 4px;
    }

    .result-card {
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
    }

    .result-main {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .result-name {
      display: block;
      margin-bottom: 6px;
      color: #222;
      font-size: 16px;
      font-weight: bold;
    }

    .result-detail {
      display: block;
      margin-top: 4px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #3867d6;
      font-size: 13px;
      text-decoration: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 0 0;
    }

    .page-button {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
    }

    .page-button:disabled {
      cursor: default;
      color: #aaa;
    }

    .map-area {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #f2f3f5;
    }

    @media (max-width: 700px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(280px, 45vh) 1fr;
        height: 100vh;
      }

      .map-area {
        grid-row: 1;
      }

      .sidebar {
        grid-row: 2;
        padding: 16px;
        border-right: 0;
        border-top: 1px solid #ddd;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="sidebar">
      <h1>장소 검색</h1>

      <form class="search-form" id="searchForm">
        <input
          class="search-input"
          id="searchInput"
          type="search"
          placeholder="장소나 키워드를 입력하세요"
          aria-label="장소 검색어"
        >
        <button class="search-button" type="submit">검색</button>
      </form>

      <button class="location-button" id="locationButton" type="button">
        현재 위치로 이동
      </button>

      <p class="status" id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <div class="results" id="results"></div>
      <nav class="pagination" id="pagination" aria-label="검색 결과 페이지"></nav>
    </section>

    <section class="map-area" aria-label="지도">
      <div id="map"></div>
    </section>
  </main>

  <script>
    let map;
    let placesService;
    let currentMarker;
    let resultMarkers = [];

    const statusElement = document.getElementById("status");
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const resultsElement = document.getElementById("results");
    const paginationElement = document.getElementById("pagination");
    const locationButton = document.getElementById("locationButton");

    // 카카오 지도 SDK가 준비된 뒤 지도 초기화를 시작합니다.
    function loadKakaoMap() {
      if (!window.kakao || !window.kakao.maps) {
        showMapError();
        return;
      }

      kakao.maps.load(initializeMap);
    }

    // 지도 SDK를 불러오지 못했을 때 안내합니다.
    function showMapError() {
      statusElement.textContent =
        "지도를 불러오지 못했습니다. 카카오 키와 등록된 사이트 도메인을 확인해 주세요.";
    }

    // SDK가 준비된 뒤 지도와 검색 기능을 초기화합니다.
    function initializeMap() {
      const initialPosition = new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: initialPosition,
        level: 5
      });

      placesService = new kakao.maps.services.Places();

      searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        searchPlaces(1);
      });

      locationButton.addEventListener("click", requestCurrentLocation);

      statusElement.textContent = "현재 위치를 확인하고 있습니다.";
      requestCurrentLocation();
    }

    // 브라우저에 현재 위치 권한을 요청하고, 성공하면 지도 중심을 옮깁니다.
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        statusElement.textContent = "이 브라우저에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      statusElement.textContent = "현재 위치를 확인하고 있습니다.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);

          if (currentMarker) {
            currentMarker.setMap(null);
          }

          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "현재 위치"
          });

          statusElement.textContent = "현재 위치를 지도에 표시했습니다.";
        },
        function (error) {
          if (error.code === error.PERMISSION_DENIED) {
            statusElement.textContent =
              "위치 권한이 허용되지 않았습니다. 서울시청을 기준으로 지도를 표시합니다.";
          } else {
            statusElement.textContent =
              "현재 위치를 확인하지 못했습니다. 서울시청을 기준으로 지도를 표시합니다.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 입력한 키워드로 장소를 검색합니다.
    function searchPlaces(page) {
      const keyword = searchInput.value.trim();

      if (!keyword) {
        statusElement.textContent = "검색어를 입력해 주세요.";
        searchInput.focus();
        return;
      }

      if (!placesService) {
        statusElement.textContent = "지도가 아직 준비되지 않았습니다.";
        return;
      }

      statusElement.textContent = "장소를 검색하고 있습니다.";
      resultsElement.replaceChildren();
      paginationElement.replaceChildren();
      clearResultMarkers();

      placesService.keywordSearch(
        keyword,
        function (data, status, pagination) {
          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
            displayPagination(pagination);

            statusElement.textContent = "검색 결과 " + data.length + "개를 찾았습니다.";
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            statusElement.textContent = "검색 결과가 없습니다.";
          } else {
            statusElement.textContent = "검색 중 문제가 발생했습니다. 다시 시도해 주세요.";
          }
        },
        {
          page: page,
          size: 10
        }
      );
    }

    // 검색 결과를 목록과 지도 마커로 표시합니다.
    function displayPlaces(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        resultMarkers.push(marker);
        bounds.extend(position);

        const card = document.createElement("article");
        card.className = "result-card";

        const mainButton = document.createElement("button");
        mainButton.className = "result-main";
        mainButton.type = "button";

        const name = document.createElement("span");
        name.className = "result-name";
        name.textContent = place.place_name;

        const category = document.createElement("span");
        category.className = "result-detail";
        category.textContent = place.category_name || "분류 정보 없음";

        const address = document.createElement("span");
        address.className = "result-detail";
        address.textContent =
          place.road_address_name || place.address_name || "주소 정보 없음";

        const phone = document.createElement("span");
        phone.className = "result-detail";
        phone.textContent = place.phone || "전화번호 정보 없음";

        mainButton.append(name, category, address, phone);

        mainButton.addEventListener("click", function () {
          map.panTo(position);
        });

        card.appendChild(mainButton);

        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";
          card.appendChild(link);
        }

        resultsElement.appendChild(card);
      });

      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 이전·다음 버튼으로 검색 결과 페이지를 이동합니다.
    function displayPagination(pagination) {
      paginationElement.replaceChildren();

      const previousButton = document.createElement("button");
      previousButton.className = "page-button";
      previousButton.type = "button";
      previousButton.textContent = "이전";
      previousButton.disabled = pagination.current <= 1;
      previousButton.addEventListener("click", function () {
        pagination.gotoPage(pagination.current - 1);
      });

      const pageLabel = document.createElement("span");
      pageLabel.textContent = pagination.current + " / " + pagination.last;

      const nextButton = document.createElement("button");
      nextButton.className = "page-button";
      nextButton.type = "button";
      nextButton.textContent = "다음";
      nextButton.disabled = pagination.current >= pagination.last;
      nextButton.addEventListener("click", function () {
        pagination.gotoPage(pagination.current + 1);
      });

      paginationElement.append(previousButton, pageLabel, nextButton);
    }

    // 이전 검색에서 만든 마커를 지도에서 제거합니다.
    function clearResultMarkers() {
      resultMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      resultMarkers = [];
    }
  </script>

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5006ab42f83cfb03852191a3a35e0a9e&amp;libraries=services&amp;autoload=false"
    async
    onload="loadKakaoMap()"
    onerror="showMapError()"
  ></script>
</body>
</html>
